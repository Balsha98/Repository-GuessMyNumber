<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/media/thinking.png">
    <title>JS | Guess My Number</title>
</head>

<body>
    <header>
        <button id="again-btn">AGAIN!</button>
        <p>(Between 1 & 20)</p>
    </header>

    <div id="middle-div">
        <h1>Guess My Number!</h1>
        <div id="flex-div">
            <hr>
            <div id="revealing-div">?</div>
            <hr>
        </div>
    </div>

    <div id="bottom-div">
        <div id="left-div">
            <input type="number" id="num-input" min="1" max="20">
            <button id="check-btn">CHECK!</button>
        </div>
        <div id="right-div">
            <p id="intro-txt">&#129300; Start guessing...</p>
            <p id="score-txt">&#128175; Score: <span id="score">20</span></p>
            <p id="hscore-txt">&#129351; High Score: <span id="high-score">0</span></p>
        </div>
    </div>

    <script src="assets/javascript/script.js"></script>
</body>

</html>
